name: BoatRace Predictor

# Night run for the race day that has just started (JST):
#   results fetch -> training -> prediction (incl. trio probabilities)
#   -> verification of past race days -> race board without odds.
# The v1 day file with that day's entry lists appears around 00:15 JST.
# Scheduled runs are often delayed by hours, so the run is placed early
# enough to finish before the first deadlines (~08:45 JST).

on:
  workflow_dispatch:
  schedule:
    - cron: '37 15 * * *'   # 15:37 UTC = 00:37 JST

concurrency:
  group: boatrace-data
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TARGET_STADIUM_IDS: ${{ secrets.TARGET_STADIUM_IDS }}
      STADIUM_PREF_MAP: ${{ secrets.STADIUM_PREF_MAP }}
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas requests scikit-learn scipy lightgbm

      - name: Fetch race results
        run: python fetch_boatrace.py

      - name: Run prediction
        run: python predict_boatrace.py

      - name: Verify past race days
        run: python verify_trio.py

      - name: Build race board (no odds)
        run: python race_day.py --no-odds --repredict never

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boatrace_results.csv prediction_history.csv data models 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Auto-update data [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "Push succeeded"
              exit 0
            fi
            echo "Push rejected, rebasing and retrying ($i/3)..."
            git pull --rebase origin main
          done
          echo "Push failed after 3 retries"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: outputs
          path: |
            prediction_result.txt
            prediction_history.csv
            site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: run-script
    runs-on: ubuntu-latest
    # Requires Settings > Pages > Source = "GitHub Actions".
    # A failure here never affects the data commit above.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
